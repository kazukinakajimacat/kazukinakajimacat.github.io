name: 執筆の記録を更新

on:
  schedule:
    - cron: "17 */3 * * *" # 3時間ごと
  workflow_dispatch: # 手動でも実行できる
  push:
    branches: [main]
    paths: [data/linkedin.json] # LinkedIn の記事を足したらすぐ反映

permissions:
  contents: write

concurrency:
  group: collect-posts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/collect_posts.py
      - name: 変わっていればコミット
        run: |
          if git diff --quiet -- data/posts.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git commit -m "執筆の記録を更新"
          git push
